[package]
name = "vulnwatch"
version = "0.1.0"
edition = "2024"
description = "Inventory-based vulnerability digest: collectors report what is installed, the analyzer matches it against Debian/Arch trackers, OSV, Trivy, CISA KEV and EPSS."
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
opskit = { git = "https://github.com/samothx/opskit", tag = "v0.1.0" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
